<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leon Azdajic — Social preview source</title>
  <style>
    @font-face { font-family: Inter; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2'); font-weight: 100 900; }
    @font-face { font-family: Mono; src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2'); font-weight: 100 800; }
    * { box-sizing: border-box; margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; background: #0d1321; color: #eef1f5; font-family: Inter, sans-serif; font-feature-settings: "cv11", "ss01"; }
    main { position: relative; height: 630px; padding: 56px 64px 48px; display: flex; flex-direction: column; }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 32px 32px; -webkit-mask-image: radial-gradient(ellipse 80% 70% at 75% 35%, #000 20%, transparent 75%); }
    .mono { font-family: Mono, monospace; }
    .top { position: relative; display: flex; justify-content: space-between; font-size: 17px; color: #7cc6d2; }
    .top span:last-child { color: #9aa5b8; }
    h1 { position: relative; font-size: 84px; font-weight: 600; letter-spacing: -3px; line-height: 1; margin-top: 30px; color: #fff; }
    .role { position: relative; margin-top: 18px; font-size: 27px; line-height: 1.4; max-width: 760px; }
    .figs { position: relative; display: flex; gap: 40px; margin-top: auto; padding-top: 26px; border-top: 1px solid rgba(255,255,255,.1); font-size: 19px; color: #9aa5b8; }
    .figs b { font-family: Mono, monospace; color: #fff; font-weight: 600; margin-right: 8px; }
  </style>
</head>
<body>
  <main>
    <div class="grid"></div>
    <div class="top mono"><span>portfolio · case studies · interactive demo</span><span>leonazdajic.github.io</span></div>
    <h1>Leon Azdajic</h1>
    <p class="role">Business analyst who also builds the tools — turning manual processes into software that teams actually use.</p>
    <div class="figs"><span><b>&gt;90%</b>less validation effort</span><span><b>~33,000</b>contracts simulated</span><span><b>25</b>markets automated</span></div>
  </main>
</body>
</html>
